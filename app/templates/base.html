<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <header class="border-b border-slate-800 bg-slate-900/70">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
      <a href="/" class="flex items-center gap-2 font-semibold tracking-tight">
        <span class="inline-block h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
        {{ app_name }}
      </a>
      {% if user %}
      <div class="flex items-center gap-3 text-sm text-slate-300">
        <span>{{ user.username }}{% if user.is_admin %} · admin{% endif %}</span>
        <form method="post" action="/logout">
          <button class="rounded-md border border-slate-700 px-3 py-1 hover:bg-slate-800">Keluar</button>
        </form>
      </div>
      {% endif %}
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>
  <footer class="mx-auto max-w-6xl px-4 pb-8 pt-4 text-xs text-slate-500">
    Zona waktu {{ tz_name }} · akses tercatat
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
