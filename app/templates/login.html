{% extends "base.html" %}
{% block title %}Masuk · {{ app_name }}{% endblock %}

{% block content %}
<div class="mx-auto mt-10 max-w-sm">
  <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-6 shadow-xl">
    <h1 class="mb-1 text-xl font-semibold">Masuk</h1>
    <p class="mb-5 text-sm text-slate-400">Pemantauan CCTV — akses terbatas.</p>

    {% if error %}
    <div class="mb-4 rounded-lg border border-red-800 bg-red-950/60 px-3 py-2 text-sm text-red-200">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label for="username" class="mb-1 block text-sm text-slate-300">Username</label>
        <input id="username" name="username" value="{{ username }}" required autofocus
               autocomplete="username"
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm outline-none focus:border-emerald-500">
      </div>
      <div>
        <label for="password" class="mb-1 block text-sm text-slate-300">Password</label>
        <input id="password" name="password" type="password" required
               autocomplete="current-password"
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm outline-none focus:border-emerald-500">
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-emerald-500 px-3 py-2 text-sm font-semibold text-slate-950 hover:bg-emerald-400">
        Masuk
      </button>
    </form>
  </div>
</div>
{% endblock %}
